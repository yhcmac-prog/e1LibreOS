# e1LibreOS 软件源配置（仿 Fedora 的 /etc/yum.repos.d/）
# 格式：<id>|<名称>|<路径或URL>（按顺序取第一个可用者 = 自带 fallback 机制）
# URL 源约定：$URL/repo.db 为索引，$URL/packages/<文件名> 为包下载地址
# fallback：e1repo 网络仓库不可用时自动落到本地仓库 /srv/repo
# 10.0.2.2 是 VirtualBox NAT 网关（VM 访问宿主机的固定地址，DHCP IP 变也不影响）
net|e1pkg 网络仓库(VBox NAT)|http://10.0.2.2:8000/e1repo
net|e1pkg 网络仓库(LAN)|http://192.168.1.102:8000/e1repo
local|e1LibreOS Local Repo|/srv/repo
